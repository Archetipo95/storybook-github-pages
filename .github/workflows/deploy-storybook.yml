name: Deploy Storybook to GitHub Pages

on:
  workflow_call:
    inputs:
      path:
        description: 'Path to the built static Storybook directory'
        required: false
        type: string
        default: 'storybook-static'
      package_manager:
        description: 'Package manager to use (npm, yarn, pnpm, bun)'
        required: false
        type: string
        default: 'npm'
      install_command:
        description: 'Custom command to install dependencies'
        required: false
        type: string
        default: ''
      build_command:
        description: 'Custom command to build Storybook'
        required: false
        type: string
        default: ''
      artifact_name:
        description: 'GitHub Pages artifact name'
        required: false
        type: string
        default: 'github-pages'
      environment:
        description: 'GitHub Pages deployment environment name'
        required: false
        type: string
        default: 'github-pages'
      mode:
        description: 'Deployment mode: artifact or trusted branch-backed directory'
        required: false
        type: string
        default: 'artifact'
      pages_branch:
        description: 'Branch used by directory mode'
        required: false
        type: string
        default: 'gh-pages'
      target_directory:
        description: 'Directory replaced by directory mode; empty publishes the root'
        required: false
        type: string
        default: ''
      site_url:
        description: 'Canonical Pages site URL for metadata'
        required: false
        type: string
        default: ''
      base_path:
        description: 'Optional URL base path'
        required: false
        type: string
        default: ''
    outputs:
      page_url:
        description: 'The URL of the deployed GitHub Pages site'
        value: ${{ inputs.mode == 'directory' && jobs.directory-publish.outputs.page_url || jobs.deploy.outputs.page_url }}
      status:
        description: 'Status of the deployment'
        value: ${{ inputs.mode == 'directory' && jobs.directory-publish.outputs.status || jobs.deploy.outputs.status }}
      deployment_id:
        description: 'The deployment ID'
        value: ${{ jobs.deploy.outputs.deployment_id }}

concurrency:
  group: storybook-pages-${{ github.repository }}-${{ inputs.pages_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build & Validate Storybook
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        if: ${{ inputs.package_manager == 'npm' || inputs.package_manager == 'yarn' || inputs.package_manager == 'pnpm' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Run custom install command
        if: ${{ inputs.install_command != '' }}
        run: ${{ inputs.install_command }}

      - name: Run custom build command
        if: ${{ inputs.build_command != '' }}
        run: ${{ inputs.build_command }}

      - name: Validate static artifact
        run: |
          node -e '
            import("./src/validate-artifact.js").then(m => {
              m.validateArtifactDirectory(process.env.TARGET_PATH, process.env.WORKSPACE_ROOT);
              console.log("Artifact validation successful");
            });
          '
        env:
          TARGET_PATH: ${{ inputs.path }}
          WORKSPACE_ROOT: ${{ github.workspace }}

      - name: Upload Pages artifact
        if: ${{ inputs.mode == 'artifact' }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ inputs.path }}
          name: ${{ inputs.artifact_name }}

      - name: Upload trusted directory input
        if: ${{ inputs.mode == 'directory' }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          path: ${{ inputs.path }}
          name: ${{ inputs.artifact_name }}
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build-and-upload
    if: ${{ inputs.mode == 'artifact' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy-pages.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    outputs:
      page_url: ${{ steps.deploy-pages.outputs.page_url }}
      status: 'success'
      deployment_id: ${{ steps.deploy-pages.outputs.deployment_id }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: ${{ inputs.artifact_name }}

  directory-publish:
    name: Publish Storybook directory
    needs: build-and-upload
    if: ${{ inputs.mode == 'directory' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      page_url: ${{ steps.publish.outputs.page_url }}
      status: success
    steps:
      - name: Checkout publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: publisher
      - name: Download trusted build output
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.artifact_name }}
          path: storybook-static
      - name: Checkout Pages branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.pages_branch }}
          path: pages-repo
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish directory atomically
        id: publish
        env:
          PAGES_REPO: ${{ github.workspace }}/pages-repo
          SOURCE_DIRECTORY: ${{ github.workspace }}/storybook-static
          PAGES_BRANCH: ${{ inputs.pages_branch }}
          TARGET_DIRECTORY: ${{ inputs.target_directory }}
          SITE_URL: ${{ inputs.site_url }}
          BASE_PATH: ${{ inputs.base_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node "${{ github.workspace }}/publisher/src/publish-directory.js"
