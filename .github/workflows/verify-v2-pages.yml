name: Verify v2 Pages deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-fixture:
    name: Deploy v2 fixture
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and deploy fixture with v2
        id: deploy
        uses: ./v2
        with:
          static_dir: test/fixtures/sample-storybook
          artifact_name: v2-pages-verification
