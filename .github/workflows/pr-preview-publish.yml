name: PR Preview Publish

# Trusted publisher. Triggered only by a *completed* `PR Preview Build` run
# (never directly by pull_request activity), so this workflow's own
# definition is always read from the default branch regardless of what a PR
# changed - a PR can never rewrite the rules that govern its own publish.
#
# The `gate` job is the sole authority for "is this safe to publish": it
# only proceeds for a successful, same-repository `pull_request` build
# (`workflow_run.pull_requests` is populated by GitHub only for
# same-repository pull requests and is empty for forks - this is the
# primary, GitHub-enforced fork/same-repo boundary), then independently
# fetches the pull request's *current* head SHA from the API. No PR content
# is ever checked out by this workflow; only the trusted Pages branch is.
#
# `publish` re-validates the build artifact's bundled metadata against this
# trusted context (repository, run id, PR number, base ref, head repo,
# head SHA, artifact name) before touching the filesystem, and again
# compares the metadata head SHA against the freshly-fetched current head
# SHA so an older completed run can never overwrite a newer preview.

on:
  workflow_run:
    workflows: ["PR Preview Build"]
    types: [completed]

concurrency:
  group: storybook-pages-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Validate provenance (trusted, read-only)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pr_number: ${{ steps.context.outputs.pr_number }}
      base_ref: ${{ steps.context.outputs.base_ref }}
      current_head_sha: ${{ steps.current.outputs.head_sha }}
    steps:
      - name: Extract trusted pull request context
        id: context
        env:
          PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          node -e '
            const prs = JSON.parse(process.env.PULL_REQUESTS || "[]");
            if (!Array.isArray(prs) || prs.length === 0) {
              console.error("No same-repository pull request is associated with this workflow run");
              process.exit(1);
            }
            const pr = prs[0];
            if (!Number.isInteger(pr.number) || pr.number <= 0) {
              console.error("Pull request number from workflow_run context is invalid");
              process.exit(1);
            }
            console.log(`pr_number=${pr.number}`);
            console.log(`base_ref=${pr.base.ref}`);
          ' >> "$GITHUB_OUTPUT"

      - name: Fetch current pull request head SHA
        id: current
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          response=$(curl -sf \
            -H "authorization: token $GITHUB_TOKEN" \
            -H "accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER")
          node -e '
            const data = JSON.parse(process.argv[1]);
            const sha = data && data.head && data.head.sha;
            if (typeof sha !== "string" || !/^[0-9a-f]{40}$/.test(sha)) {
              console.error("Pull request API response did not contain a valid head SHA");
              process.exit(1);
            }
            console.log(`head_sha=${sha}`);
          ' "$response" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish preview (trusted)
    needs: gate
    if: needs.gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve trusted base configuration
        id: config
        run: |
          node -e 'import("./src/config.js").then(({resolveConfiguration}) => {
            const c = resolveConfiguration({inputs: {}});
            console.log(`preview_root=${c.preview_root}`);
          })' >> "$GITHUB_OUTPUT"

      - name: Download build artifact from the source run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storybook-preview-pr-${{ needs.gate.outputs.pr_number }}-run-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/preview-bundle

      - name: Checkout Pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages-repo
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate provenance and publish
        env:
          BUNDLE_DIR: ${{ runner.temp }}/preview-bundle
          PAGES_REPO: ${{ github.workspace }}/pages-repo
          PAGES_BRANCH: gh-pages
          PREVIEW_ROOT: ${{ steps.config.outputs.preview_root }}
          SITE_URL: ''
          BASE_PATH: ''
          TRUSTED_REPOSITORY: ${{ github.repository }}
          TRUSTED_RUN_ID: ${{ github.event.workflow_run.id }}
          TRUSTED_PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          TRUSTED_BASE_REF: ${{ needs.gate.outputs.base_ref }}
          TRUSTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRUSTED_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          EXPECTED_ARTIFACT_NAME: storybook-preview-pr-${{ needs.gate.outputs.pr_number }}-run-${{ github.event.workflow_run.id }}
          CURRENT_HEAD_SHA: ${{ needs.gate.outputs.current_head_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node src/preview-publish.js
