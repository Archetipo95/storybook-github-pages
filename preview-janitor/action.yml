name: Trusted Storybook preview janitor
description: Prune stale or closed pull request preview directories from a Pages branch
inputs:
  pages_repo:
    description: 'Path to checked-out Pages branch repository'
    required: false
    default: ''
  pages_branch:
    description: 'Pages branch name'
    required: false
    default: 'gh-pages'
  preview_root:
    description: 'Root directory for previews on the Pages branch'
    required: false
    default: 'pr-preview'
  retention_days:
    description: 'Retention days for open PR previews (0 disables age-based pruning)'
    required: false
    default: '30'
  warning_days_before_cleanup:
    description: 'Days before cleanup to warn in the PR comment (0 disables warnings)'
    required: false
    default: '3'
  site_url:
    description: 'Canonical Pages site URL used to build absolute links in the generated 404.html'
    required: false
    default: ''
  generate_portal:
    description: 'Whether to regenerate the environment landing portal (index.html or portal/index.html) and 404.html on the Pages branch (defaults to .storybook-pages.yml, then false)'
    required: false
    default: ''
  portal_title:
    description: 'Title of the environment landing portal (defaults to "<repo> Storybook Environments")'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PAGES_REPO: ${{ inputs.pages_repo }}
        PAGES_BRANCH: ${{ inputs.pages_branch }}
        PREVIEW_ROOT: ${{ inputs.preview_root }}
        PREVIEW_RETENTION_DAYS: ${{ inputs.retention_days }}
        WARNING_DAYS_BEFORE_CLEANUP: ${{ inputs.warning_days_before_cleanup }}
        SITE_URL: ${{ inputs.site_url }}
        GENERATE_PORTAL: ${{ inputs.generate_portal }}
        PORTAL_TITLE: ${{ inputs.portal_title }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: node "${{ github.action_path }}/../src/preview-janitor.js"
